---
Organizations:

  - &OrdererOrg
    Name: OrdererOrg
    ID: OrdererMSP
    MSPDir: crypto-config/ordererOrganizations/example.com/msp

    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('OrdererMSP.admin')"

  - &OEMOrg
    Name: OEMOrg
    ID: OEMMSP
    MSPDir: crypto-config/peerOrganizations/oem.example.com/msp

    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OEMMSP.admin', 'OEMMSP.peer', 'OEMMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('OEMMSP.admin', 'OEMMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('OEMMSP.admin')"

    AnchorPeers:
      - Host: peer0.oem.example.com
        Port: 7051

  - &CarrierOrg
    Name: CarrierOrg
    ID: CarrierMSP
    MSPDir: crypto-config/peerOrganizations/carrier.example.com/msp

    Policies:
      Readers:
        Type: Signature
        Rule: "OR('CarrierMSP.admin', 'CarrierMSP.peer', 'CarrierMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('CarrierMSP.admin', 'CarrierMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('CarrierMSP.admin')"

    AnchorPeers:
      - Host: peer0.carrier.example.com
        Port: 9051


Capabilities:

  Channel: &ChannelCapabilities
    V2_0: true

  Orderer: &OrdererCapabilities
    V2_0: true

  Application: &ApplicationCapabilities
    V2_0: true


Channel: &ChannelDefaults

  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"

  Capabilities:
    <<: *ChannelCapabilities


Application: &ApplicationDefaults

  Organizations:

  Policies:
    LifecycleEndorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
    Endorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"

  Capabilities:
    <<: *ApplicationCapabilities


Orderer: &OrdererDefaults

  OrdererType: etcdraft

  Addresses:
    - orderer.example.com:7050

  BatchTimeout: 2s

  BatchSize:
    MaxMessageCount: 100
    AbsoluteMaxBytes: 99 MB
    PreferredMaxBytes: 512 KB

  EtcdRaft:
    Consenters:
      - Host: orderer.example.com
        Port: 7050
        ClientTLSCert: crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/tls/server.crt
        ServerTLSCert: crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/tls/server.crt

  Organizations:

  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    BlockValidation:
      Type: ImplicitMeta
      Rule: "ANY Writers"

  Capabilities:
    <<: *OrdererCapabilities


Consortiums:

  SampleConsortium:
    Organizations:
      - *OEMOrg
      - *CarrierOrg


Profiles:

  TwoOrgsOrdererGenesis:
    <<: *ChannelDefaults

    Orderer:
      <<: *OrdererDefaults
      Organizations:
        - *OrdererOrg

    Consortiums:
      SampleConsortium:
        Organizations:
          - *OEMOrg
          - *CarrierOrg

  TwoOrgsChannel:
    Consortium: SampleConsortium

    <<: *ChannelDefaults

    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *OEMOrg
        - *CarrierOrg
      Capabilities:
        <<: *ApplicationCapabilities