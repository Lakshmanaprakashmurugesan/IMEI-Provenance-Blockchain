services:
  api-gateway:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    ports: ["8000:8000"]
    volumes:
      - ./data:/app/data:ro

  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
    environment:
      IMEI_GATEWAY_URL: http://api-gateway:8000/api/v1/provenance/verify
    ports: ["8501:8501"]
    depends_on: [api-gateway]
    volumes:
      - ./data:/app/data:ro
      - ./evidence:/app/evidence
      - ./tests:/app/tests

# Prototype scope only: API + dashboard.
# No Kafka broker, Fabric peer/orderer/CA, Kubernetes, or production infrastructure is deployed here.
