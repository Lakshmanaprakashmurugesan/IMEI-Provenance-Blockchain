name: Prototype Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python validation
        run: python run_validation.py

  go-validation:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: chaincode/imei

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          cache-dependency-path: chaincode/imei/go.sum

      - name: Run Go tests
        run: go test ./...